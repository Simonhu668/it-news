<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITIL 4 学习</title>
<style>
:root {
  --bg:#faf9f6; --surface:#ffffff; --ink:#202a30; --ink-3:#444e55; --ink-4:#7d888e;
  --line:#dfe4e1; --line-soft:#ecefe9; --accent:#176b75; --accent-ink:#145f68;
  --amber:#a5761a; --amber-bg:#faf0d7; --code-bg:#f3f3ef;
}
@media (prefers-color-scheme:dark) {
  :root {
    --bg:#14181a; --surface:#1e2528; --ink:#e9edee; --ink-3:#a9b4b8; --ink-4:#758086;
    --line:#2c3438; --line-soft:#232a2e; --accent:#4fb3bd; --accent-ink:#7ccdd4;
    --amber:#d3a94e; --amber-bg:#3a2f14; --code-bg:#232a2e;
  }
}
body { margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; }
.wrap { max-width:860px; margin:0 auto; padding:28px 18px 80px; }
.back { display:inline-block; margin-bottom:14px; color:var(--accent); text-decoration:none; font-size:14px; }
h1 { font-size:26px; margin:0 0 8px; }
.sub { color:var(--ink-4); font-size:14px; margin-bottom:26px; }
h2 { font-size:19px; margin:30px 0 12px; padding-top:8px; border-top:1px solid var(--line-soft); }
h3 { font-size:16px; margin:18px 0 8px; }
.code, code { font-family:ui-monospace,Menlo,Consolas,monospace; background:var(--code-bg);
  padding:2px 8px; border-radius:6px; font-size:13.5px; color:var(--accent-ink); }
pre { background:var(--code-bg); border-radius:10px; padding:14px 16px; font-size:13.5px;
  line-height:1.7; overflow-x:auto; white-space:pre-wrap; }
.card { background:var(--surface); border:1px solid var(--line-soft); border-radius:10px;
  padding:14px 16px; margin:12px 0; }
.card p, .card li { font-size:14.5px; line-height:1.7; color:var(--ink-3); }
.card ul, .card ol { margin:6px 0 2px; padding-left:20px; }
.day { background:var(--surface); border:1px solid var(--line-soft); border-radius:10px;
  padding:14px 16px; margin:12px 0; }
.day .dh { font-size:17px; font-weight:700; margin-bottom:8px; }
.day .dh .today { background:var(--amber-bg); color:var(--amber); font-size:12px;
  border-radius:12px; padding:2px 10px; margin-left:8px; }
.word { margin:7px 0; font-size:15px; line-height:1.65; }
.word .w { font-weight:700; }
.word .ph { color:var(--ink-4); font-size:13px; }
.word .pos { color:var(--accent-ink); font-size:13px; }
.word .cn { font-weight:700; }
.word .ex { color:var(--ink-4); font-size:13.5px; }
.newtag { background:var(--amber-bg); color:var(--amber); font-size:11px; border-radius:8px;
  padding:1px 7px; margin-left:6px; }
table { width:100%; border-collapse:collapse; font-size:14px; margin:10px 0; background:var(--surface);
  border-radius:10px; overflow:hidden; border:1px solid var(--line-soft); }
th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line-soft); }
th { background:var(--code-bg); }
.tip { color:var(--ink-4); font-size:13px; margin-top:26px; border-top:1px solid var(--line-soft); padding-top:12px; }
a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">

</html>
